# Weekly dependency PRs. Updates are the only way pinned versions (workflow
# action SHAs, lockfile entries) move, so they are reviewed like any other change.
# Minor and patch updates arrive as one grouped PR per ecosystem; npm major
# versions are left for a deliberate upgrade. Security updates are separate
# (Dependabot security updates) and are not affected by these rules.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let a brand-new release sit for a week before proposing it, so a
    # hijacked or yanked release is more likely to be caught first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2

  - package-ecosystem: "npm"
    # pnpm workspace: the root plus every workspace package.
    directories:
      - "/"
      - "/understand-anything-plugin"
      - "/understand-anything-plugin/packages/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2
